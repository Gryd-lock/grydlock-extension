name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev

      - name: Audit all dependencies, including devDependencies (informational)
        run: npm audit
        continue-on-error: true

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run validate:manifest
      - run: npm run check:versions
      - run: npm run build

      - name: Install Playwright + system deps (single install, post-build)
        run: npx playwright install --with-deps chromium

      - run: npm run test:visual
      # STILL OPEN: no step here validates dist/manifest.json post-build —
      # only the pre-build source manifest is checked above. Add once
      # validate-manifest.mjs supports a --root flag (see earlier note).